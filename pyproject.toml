[project]
name = "de-power-price-lakehouse"
version = "0.1.0"
description = "German Power Price Lakehouse demo project"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "tenacity"
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "ipykernel>=6.29",
]

[project.scripts]
energy_charts_api = "de_power_price.api.energy_charts:cli"
weather_api = "de_power_price.api.weather:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/de_power_price"]