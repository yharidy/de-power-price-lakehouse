[project]
name = "de-power-price-lakehouse"
version = "0.1.0"
description = "German Power Price Lakehouse demo project"
requires-python = ">=3.14"
dependencies = [
    "requests",
    "tenacity",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]